<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6efe3" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%83%3C/text%3E%3C/svg%3E" />
<title>Kabak Tatlısı</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6efe3; color: #2b241c; font: 18px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  form { width: min(440px, 100%); background: #fffaf2; border: 1px solid #e6dccb; border-radius: 22px; padding: 40px 36px; box-shadow: 0 20px 60px #6b4e2a22; }
  .logo { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo b { width: 54px; height: 54px; border-radius: 14px; background: #f3e2c4; display: grid; place-items: center; font-size: 30px; }
  .logo span { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .logo small { display: block; font-size: 14px; color: #9a8a74; font-weight: 500; letter-spacing: 0; }
  label { font-size: 15px; color: #8a7a64; }
  input { width: 100%; margin: 8px 0 18px; height: 64px; border-radius: 14px; border: 1px solid #e0d4bf; background: #fff; color: #2b241c; font-size: 22px; padding: 0 18px; outline: none; }
  input:focus { border-color: #c8792e; }
  button { width: 100%; height: 64px; border: 0; border-radius: 14px; background: #c8792e; color: #fff; font-size: 20px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: #b3402a; min-height: 24px; margin-top: 14px; font-size: 16px; }
  .note { color: #a8998a; font-size: 14px; margin-top: 18px; }
</style>
</head>
<body>
<form id="f">
  <div class="logo"><b>🎃</b><span>Kabak Tatlısı<small>Aile tarif defteri</small></span></div>
  <label for="u">Kullanıcı adı</label>
  <input id="u" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus />
  <label for="p">Şifre</label>
  <input id="p" type="password" autocomplete="current-password" />
  <button id="b">Giriş</button>
  <div class="err" id="e"></div>
  <div class="note">Bu cihazda oturum açık kalır.</div>
</form>
<script>
  const f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e')
  f.onsubmit = async (ev) => {
    ev.preventDefault(); b.disabled = true; e.textContent = ''
    try {
      const r = await fetch('/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) })
      const j = await r.json()
      if (j.ok) location.replace('/')
      else e.textContent = j.error || 'Olmadı'
    } catch { e.textContent = 'Sunucuya ulaşılamadı' }
    b.disabled = false
  }
</script>
</body>
</html>
