<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08090b" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.png" />
<title>Giriş</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(1200px 600px at 20% 10%, #1b0d0f 0%, #08090b 60%); color: #ececec; font: 18px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  form { width: min(440px, 100%); background: #111317; border: 1px solid #1f232a; border-radius: 22px; padding: 40px 36px; box-shadow: 0 30px 80px #0009; }
  .logo { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo b { width: 54px; height: 54px; border-radius: 14px; background: #e50914; display: grid; place-items: center; font-size: 32px; font-weight: 900; color: #fff; }
  .logo span { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .logo small { display: block; font-size: 14px; color: #8a9099; font-weight: 500; letter-spacing: 0; }
  label { font-size: 15px; color: #9aa1aa; }
  input { width: 100%; margin: 8px 0 18px; height: 64px; border-radius: 14px; border: 1px solid #2a2f37; background: #0a0b0d; color: #fff; font-size: 22px; padding: 0 18px; outline: none; }
  input:focus { border-color: #e50914; }
  button { width: 100%; height: 64px; border: 0; border-radius: 14px; background: #e50914; color: #fff; font-size: 20px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: #ff6b6b; min-height: 24px; margin-top: 14px; font-size: 16px; }
  .note { color: #6c727b; font-size: 14px; margin-top: 18px; }
</style>
</head>
<body>
<form id="f">
  <div class="logo"><b>B</b><span>BerkStream N<small>Tesla • Canlı TV • Film & Dizi</small></span></div>
  <label for="u">Kullanıcı adı</label>
  <input id="u" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus />
  <label for="p">Şifre</label>
  <input id="p" type="password" autocomplete="current-password" />
  <button id="b">Giriş</button>
  <div class="err" id="e"></div>
  <div class="note">Bu cihaz hatırlanır, bir daha sormaz.</div>
</form>
<script>
  const f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e')
  f.onsubmit = async (ev) => {
    ev.preventDefault(); b.disabled = true; e.textContent = ''
    try {
      const r = await fetch('/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) })
      const j = await r.json()
      if (j.ok) location.replace('/')
      else e.textContent = j.error || 'Olmadı'
    } catch { e.textContent = 'Sunucuya ulaşılamadı' }
    b.disabled = false
  }
</script>
</body>
</html>
